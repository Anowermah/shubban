<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="400px" viewBox="0 0 800 400" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background Elements -->
        <circle fill="#F8D7DA" cx="600" cy="300" r="30" opacity="0.3"/>
        <circle fill="#F8D7DA" cx="200" cy="100" r="20" opacity="0.3"/>
        <circle fill="#F8D7DA" cx="700" cy="150" r="15" opacity="0.3"/>
        
        <!-- Main 404 Text -->
        <text font-family="Arial-BoldMT, Arial" font-size="180" font-weight="bold" fill="#DC3545" opacity="0.1">
            <tspan x="250" y="250">404</tspan>
        </text>
        
        <!-- Decorative Lines -->
        <path d="M100,200 C150,150 200,150 250,200" stroke="#DC3545" stroke-width="2" opacity="0.3"/>
        <path d="M550,200 C600,250 650,250 700,200" stroke="#DC3545" stroke-width="2" opacity="0.3"/>
        
        <!-- Search Icon -->
        <g transform="translate(350, 150)">
            <circle stroke="#DC3545" stroke-width="8" cx="40" cy="40" r="35"/>
            <line x1="65" y1="65" x2="100" y2="100" stroke="#DC3545" stroke-width="8" stroke-linecap="round"/>
        </g>
        
        <!-- Question Marks -->
        <text font-family="Arial-BoldMT, Arial" font-size="60" font-weight="bold" fill="#DC3545" opacity="0.4">
            <tspan x="150" y="150">?</tspan>
        </text>
        <text font-family="Arial-BoldMT, Arial" font-size="40" font-weight="bold" fill="#DC3545" opacity="0.4">
            <tspan x="600" y="250">?</tspan>
        </text>
        <text font-family="Arial-BoldMT, Arial" font-size="50" font-weight="bold" fill="#DC3545" opacity="0.4">
            <tspan x="500" y="150">?</tspan>
        </text>
    </g>
</svg>
